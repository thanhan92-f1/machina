[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machina-sdk"
version = "0.1.0"
description = "Python client for the Machina private cloud controller API"
requires-python = ">=3.9"
license = { text = "LicenseRef-Zyvor-Production-1.0" }
dependencies = []

[tool.setuptools.packages.find]
include = ["machina*"]
