[package]
name = "machina-cni"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Zyvor-Production-1.0"
description = "Native eBPF Kubernetes CNI for Machina: CNI plugin + NetworkPolicy/Service agent (datapath owned by machina-bpfd)"

[[bin]]
name = "machina-cni"
path = "src/main.rs"

[dependencies]
machina-bpf = { path = "../machina-bpf" }
machina-bpf-common = { path = "../machina-bpf-common" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
