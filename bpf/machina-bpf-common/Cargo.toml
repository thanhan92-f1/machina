[package]
name = "machina-bpf-common"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Zyvor-Production-1.0"
description = "Map key/value and event layouts shared by Machina eBPF programs and their loader"

[features]
default = []
user = ["aya"]

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14", default-features = false, optional = true }

[lib]
path = "src/lib.rs"
