[package]
name = "machina-bpf"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Zyvor-Production-1.0"
description = "Native eBPF datapath for Machina: loader, machina-bpfd service and its client"

[[bin]]
name = "machina-bpfd"
path = "src/bin/machina-bpfd.rs"

[dependencies]
machina-bpf-common = { path = "../machina-bpf-common", features = ["user"] }
machina-scx = { path = "../machina-scx" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["env"] }
md5 = { package = "md-5", version = "0.10" }
sha2 = "0.10"
regex = "1"

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14", default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
